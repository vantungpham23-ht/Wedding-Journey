# Cloudflare Pages — cấu hình build
#
# ⚠️  KHÔNG còn Functions / KV / Secrets.
#
# Lý do: danh sách khách mời đã chuyển sang **Supabase** (bảng `guests`).
#   - Dữ liệu: Supabase Postgres + Row Level Security
#   - Client:  `lib/supabase.ts` (URL + anon key hardcode, an toàn nhờ RLS)
#   - Lớp gọi: `lib/guestsSupabase.ts`
#
# Trước đây cần bind `GUESTS_KV` + set `ADMIN_PASSWORD` / `ADMIN_SECRET`
# trong Dashboard (2 nơi khác nhau → dễ lệch → dữ liệu "không đồng bộ").
# Giờ Cloudflare chỉ còn làm **hosting static** — không cần cấu hình gì.
#
# ── Chạy local ──
#   npm run build
#   npx wrangler pages dev dist

name = "wedding-journey"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"
